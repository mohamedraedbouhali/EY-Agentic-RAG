services:

  mongo:
    image: mongo:7
    container_name: ey_mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - ey_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ey_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017
    volumes:
      - chroma_data:/app/chroma_db
      - ./data:/data:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - mongo
    networks:
      - ey_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ey_frontend
    ports:
      - "3000:80"
    networks:
      - ey_net
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  hf_cache:

networks:
  ey_net:
    driver: bridge
